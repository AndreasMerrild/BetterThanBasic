<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BetterThanBasic · Calendar</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
    <div class="brand">BetterThanBasic</div>
    <nav class="nav">
        <a class="nav-item active" href="#">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7zm-2 7h14v11H5V9z"/></svg>
            Calendar
        </a>
    </nav>
    <div class="tools">
        <label class="jump">Jump to
            <input type="date" id="jump-date">
        </label>
        <button class="icon-btn" id="reload" title="Reload training data">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
    </div>
</header>

<div class="toolbar">
    <div class="nav-buttons">
        <button id="prev" title="Previous week (←)">&lsaquo;</button>
        <button id="today">Today</button>
        <button id="latest">Latest training</button>
        <button id="next" title="Next week (→)">&rsaquo;</button>
    </div>
    <h1 id="range-label"></h1>
    <div class="status" id="status"></div>
</div>

<main class="calendar" id="calendar">
    <div class="cal-head" id="cal-head"></div>
    <div id="weeks"></div>
</main>

<dialog id="details">
    <form method="dialog" class="details-card">
        <header>
            <div>
                <h2 id="details-title"></h2>
                <p id="details-sub"></p>
            </div>
            <button class="close" aria-label="Close">&times;</button>
        </header>
        <dl id="details-list"></dl>
    </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
