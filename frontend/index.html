<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BetterThanBasic · Calendar</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
    <div class="brand">BetterThanBasic</div>
    <nav class="nav">
        <a class="nav-item active" href="index.html">Calendar</a>
    </nav>
    <div class="tools">
        <label class="jump">Jump to…
            <input type="date" id="jump-date">
        </label>
        <button class="icon-btn" id="reload" title="Reload training data">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
        <div class="athlete-menu">
            <button class="user-badge" id="athlete-button" type="button" aria-haspopup="menu" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 4a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zm0 14a8 8 0 0 1-6.2-2.95C7.2 15.4 9.5 14.5 12 14.5s4.8.9 6.2 2.55A8 8 0 0 1 12 20z"/></svg>
                <span id="athlete-name">Athlete</span> <span class="caret" aria-hidden="true">&#9662;</span>
            </button>
            <!-- Filled by setupAthleteMenu() in common.js -->
            <div class="menu" id="athlete-dropdown" role="menu" hidden></div>
            <input type="file" id="upload-input" accept=".fit,.FIT,.json,.JSON" multiple hidden>
            <input type="file" id="upload-folder-input" webkitdirectory multiple hidden>
        </div>
    </div>
</header>

<div class="toolbar">
    <div class="nav-buttons">
        <button id="prev" title="Previous week (←)">&lsaquo;</button>
        <button id="today">Today</button>
        <button id="latest">Latest training</button>
        <button id="next" title="Next week (→)">&rsaquo;</button>
    </div>
    <h1 id="range-label"></h1>
    <div class="status" id="status"></div>
</div>

<main class="calendar" id="calendar">
    <div class="cal-head" id="cal-head"></div>
    <div id="weeks"></div>
</main>

<footer class="footer">
    <span>BetterThanBasic</span>
    <span>Personal training calendar</span>
</footer>

<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
